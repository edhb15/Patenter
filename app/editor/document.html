<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Limits where scripts load from and where data can be sent. The APIs are
     served from the same origin as the pages (see deploy/Caddyfile). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patenter Editor</title>
<link rel="icon" type="image/x-icon" href="../../images-and-other-branding/SmallSquareLogoJpg.jpg">
<style>
/* =========================================================
   PATENTER DOCUMENT-STYLE EDITOR
   Visual layer upgraded to match document.html.
   Existing editor functions/IDs are intentionally preserved.
========================================================= */

:root {
    --brand: #7c3aed;
    --brand-dark: #6d28d9;
    --brand-soft: #e9ddff;
    --brand-border: #c8a9ff;

    --app-bg: #e7e7e7;
    --surface: #ffffff;
    --surface-soft: #f8f8f8;
    --border: #d5d5d5;
    --border-light: #e3e3e3;
    --text: #222222;
    --muted: #777777;

    --page-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    --panel-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    --modal-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);

    --radius: 6px;
    --toolbar-height: 54px;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--app-bg);
    color: var(--text);
    overflow: hidden;
}

button,
input,
select {
    font: inherit;
}

button {
    user-select: none;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 54px;
    flex-shrink: 0;

    background: var(--surface);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 14px;
    gap: 10px;

    z-index: 1000;
}

.brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.35px;
    color: var(--brand);
    padding-right: 10px;
}

.document-title {
    width: 220px;
    height: 34px;

    border: 1px solid transparent;
    outline: none;
    background: transparent;

    font-size: 15px;
    font-weight: 600;
    color: var(--text);

    padding: 7px 9px;
    border-radius: var(--radius);

    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.document-title:hover {
    background: #f2f2f2;
}

.document-title:focus {
    background: #f7f7f7;
    border-color: #cfcfcf;
}

.save-status {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
}

.top-spacer {
    flex: 1;
}

.top-button {
    height: 34px;

    border: 1px solid #d0d0d0;
    background: #ffffff;

    border-radius: var(--radius);

    padding: 0 11px;

    cursor: pointer;
    font-size: 13px;
    color: #333;

    transition:
        background 0.12s ease,
        border-color 0.12s ease,
        box-shadow 0.12s ease;
}

.top-button:hover {
    background: #f1f1f1;
    border-color: #c4c4c4;
}

.top-button:active {
    background: #e9e9e9;
}

.top-button:focus-visible {
    outline: 2px solid rgba(124, 58, 237, 0.25);
    outline-offset: 1px;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    min-height: var(--toolbar-height);
    flex-shrink: 0;

    background: var(--surface);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    gap: 4px;
    padding: 7px 10px;

    overflow-x: auto;
    overflow-y: hidden;

    z-index: 900;

    scrollbar-width: none;
}

.toolbar::-webkit-scrollbar {
    display: none;
}

.tool-button {
    min-width: 34px;
    width: 34px;
    height: 34px;

    border: 1px solid transparent;
    background: transparent;

    border-radius: 5px;

    cursor: pointer;

    font-size: 14px;
    color: #333;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    transition:
        background 0.12s ease,
        border-color 0.12s ease,
        color 0.12s ease;
}

.tool-button:hover {
    background: #eeeeee;
    border-color: #dddddd;
}

.tool-button:active {
    background: #e5e5e5;
}

.tool-button:focus-visible {
    outline: 2px solid rgba(124, 58, 237, 0.25);
    outline-offset: 1px;
}

.tool-button.active {
    background: var(--brand-soft);
    border-color: var(--brand-border);
    color: var(--brand-dark);
}

.separator {
    width: 1px;
    height: 27px;
    flex: 0 0 1px;

    background: #dddddd;

    margin: 0 5px;
}

.tool-select {
    height: 34px;

    border: 1px solid #cccccc;
    border-radius: 5px;

    background: #ffffff;

    padding: 0 7px;

    font-size: 13px;
    color: #333;

    cursor: pointer;
    outline: none;

    transition:
        border-color 0.12s ease,
        box-shadow 0.12s ease;
}

.tool-select:hover {
    border-color: #bdbdbd;
}

.tool-select:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.10);
}

.font-select {
    width: 130px;
}

.size-select {
    width: 65px;
}

/* =========================================================
   COLOR BUTTONS
========================================================= */

.color-wrapper {
    position: relative;
    flex-shrink: 0;
}

.color-button {
    position: relative;
}

.color-line {
    position: absolute;

    bottom: 4px;
    left: 8px;
    right: 8px;

    height: 3px;
    border-radius: 2px;

    background: #000000;
}

/* =========================================================
   EDITOR AREA
========================================================= */

.editor-area {
    flex: 1;

    overflow: auto;

    padding: 40px 20px 100px;

    scroll-behavior: smooth;

    background:
        linear-gradient(
            to bottom,
            #e7e7e7 0,
            #e7e7e7 100%
        );
}

.editor-area::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

.editor-area::-webkit-scrollbar-track {
    background: transparent;
}

.editor-area::-webkit-scrollbar-thumb {
    background: #c8c8c8;
    border-radius: 8px;
    border: 3px solid #e7e7e7;
}

.editor-area::-webkit-scrollbar-thumb:hover {
    background: #adadad;
}

/* =========================================================
   DOCUMENT
========================================================= */

#document {
    width: 210mm;

    margin: 0 auto;

    display: flex;
    flex-direction: column;

    gap: 25px;

    transform-origin: top center;
    transition: margin-bottom 0.12s ease;
}

/* =========================================================
   PAGE
========================================================= */

.page {
    width: 210mm;
    height: 297mm;

    flex-shrink: 0;

    background: #ffffff;

    position: relative;

    padding:
        25mm
        22mm
        25mm
        22mm;

    box-shadow: var(--page-shadow);

    overflow: hidden;

    border: 1px solid rgba(0, 0, 0, 0.025);

    transition:
        box-shadow 0.15s ease,
        outline 0.15s ease;
}

.page:focus-within {
    box-shadow:
        var(--page-shadow),
        0 0 0 2px rgba(124, 58, 237, 0.08);
}

/* =========================================================
   PAGE CONTENT
========================================================= */

.page-content {
    width: 100%;
    height: 100%;

    outline: none;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;

    line-height: 1.5;

    color: #222222;

    word-wrap: break-word;
    overflow-wrap: break-word;

    caret-color: var(--brand);
}

.page-content:focus {
    outline: none;
}

.page-content p {
    margin-top: 0;
    margin-bottom: 10px;
}

.page-content h1 {
    font-size: 32px;
    line-height: 1.2;
    margin: 0 0 18px;
    font-weight: 700;
}

.page-content h2 {
    font-size: 25px;
    line-height: 1.25;
    margin: 0 0 15px;
    font-weight: 700;
}

.page-content h3 {
    font-size: 20px;
    line-height: 1.3;
    margin: 0 0 12px;
    font-weight: 700;
}

.page-content ul,
.page-content ol {
    margin-top: 0;
    margin-bottom: 12px;
    padding-left: 28px;
}

.page-content li {
    margin-bottom: 4px;
}

.page-content blockquote {
    margin: 12px 0;
    padding: 3px 0 3px 15px;
    border-left: 4px solid var(--brand);
    color: #555555;
}

.page-content a {
    color: #2563eb;
    text-decoration: underline;
}

.page-content img,
.page-content .editor-image {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 10px 0;
}

.page-content hr {
    border: 0;
    border-top: 1px solid #cccccc;
    margin: 18px 0;
}

.page-content pre,
.page-content code {
    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
}

.page-content code {
    background: #f1f1f1;
    border-radius: 4px;
    padding: 1px 5px;
}

.page-content pre {
    background: #f5f5f5;
    border: 1px solid #e1e1e1;
    border-radius: 6px;
    padding: 12px;
    white-space: pre-wrap;
}

/* =========================================================
   PAGE PLACEHOLDER
========================================================= */

.page-content:empty::before {
    content: "Start typing...";
    color: #aaaaaa;
    pointer-events: none;
}

/* =========================================================
   PAGE NUMBER
========================================================= */

.page-number {
    position: absolute;

    bottom: 9mm;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 11px;
    color: #888888;

    pointer-events: none;
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar {
    height: 30px;
    flex-shrink: 0;

    background: #ffffff;
    border-top: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 14px;

    font-size: 12px;
    color: #666666;

    gap: 20px;

    z-index: 950;
}

.status-spacer {
    flex: 1;
}

.zoom-controls {
    display: flex;
    align-items: center;
    gap: 6px;
}

.zoom-button {
    border: none;
    background: transparent;
    cursor: pointer;

    font-size: 14px;

    width: 22px;
    height: 22px;

    border-radius: 4px;
    color: #555555;
}

.zoom-button:hover {
    background: #eeeeee;
    color: var(--brand-dark);
}

#zoomText {
    min-width: 42px;
    text-align: center;
}

/* =========================================================
   FIND / REPLACE
========================================================= */

.find-panel {
    position: fixed;

    top: 118px;
    right: 20px;

    width: 360px;

    background: #ffffff;

    border: 1px solid #cccccc;
    border-radius: 8px;

    box-shadow: var(--panel-shadow);

    padding: 12px;

    z-index: 2000;

    display: none;
}

.find-panel.open {
    display: block;
}

.find-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

.find-row:last-of-type {
    margin-bottom: 10px;
}

.find-row input {
    flex: 1;

    min-width: 0;
    height: 34px;

    border: 1px solid #cccccc;
    border-radius: 5px;

    padding: 0 9px;

    outline: none;

    font-size: 13px;
}

.find-row input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.10);
}

.find-row button {
    height: 34px;

    border: 1px solid #cccccc;
    background: #ffffff;

    border-radius: 5px;

    cursor: pointer;

    padding: 0 9px;

    font-size: 13px;
    color: #333333;

    white-space: nowrap;
}

.find-row button:hover {
    background: #eeeeee;
}

.find-row button:active {
    background: #e4e4e4;
}

.find-info {
    font-size: 12px;
    color: #777777;
}

/* =========================================================
   LINK MODAL
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.35);

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 3000;
}

.modal-overlay.open {
    display: flex;
}

.modal {
    width: 420px;
    max-width: calc(100vw - 30px);

    background: #ffffff;

    border-radius: 10px;

    padding: 22px;

    box-shadow: var(--modal-shadow);
}

.modal h2 {
    margin: 0 0 15px;
    font-size: 20px;
}

.modal label {
    display: block;

    font-size: 13px;
    margin-bottom: 6px;
    color: #444444;
}

.modal input {
    width: 100%;

    height: 38px;

    border: 1px solid #cccccc;
    border-radius: 6px;

    padding: 0 10px;

    margin-bottom: 15px;

    outline: none;
}

.modal input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.10);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.modal-actions button {
    height: 36px;

    padding: 0 14px;

    border-radius: 6px;

    border: 1px solid #cccccc;

    background: #ffffff;

    cursor: pointer;
}

.modal-actions button:hover {
    background: #eeeeee;
}

.modal-actions button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #ffffff;
}

.modal-actions button.primary:hover {
    background: var(--brand-dark);
    border-color: var(--brand-dark);
}

/* =========================================================
   DOCUMENTS LIBRARY (IndexedDB)
========================================================= */

.library-modal {
    width: 560px;
    max-height: min(640px, calc(100vh - 40px));
    display: flex;
    flex-direction: column;
}

.library-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.library-header h2 {
    margin: 0;
}

.library-header .library-new {
    height: 34px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid var(--brand);
    background: var(--brand);
    color: #ffffff;
    cursor: pointer;
}

.library-header .library-new:hover {
    background: var(--brand-dark);
    border-color: var(--brand-dark);
}

.modal input.library-search {
    margin-bottom: 10px;
}

.library-list {
    flex: 1;
    min-height: 120px;
    overflow-y: auto;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    margin-bottom: 15px;
}

.library-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
}

.library-item:last-child {
    border-bottom: none;
}

.library-item:hover,
.library-item:focus-visible {
    background: #f6f2ff;
    outline: none;
}

.library-item.current {
    background: var(--brand-soft);
}

.library-item-main {
    flex: 1;
    min-width: 0;
}

.library-item-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.library-item-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
}

.library-item-snippet {
    font-size: 12px;
    color: #555555;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.library-delete {
    flex-shrink: 0;
    height: 30px;
    padding: 0 10px;
    border-radius: 5px;
    border: 1px solid transparent;
    background: transparent;
    color: #a33;
    cursor: pointer;
    font-size: 12px;
}

.library-delete:hover {
    background: #fdecec;
    border-color: #f2c4c4;
}

.library-empty {
    padding: 30px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

.library-actions {
    justify-content: space-between;
}

.library-actions .left {
    display: flex;
    gap: 8px;
}

/* =========================================================
   FULLSCREEN
========================================================= */

body.fullscreen .topbar {
    display: none;
}

body.fullscreen .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
}

body.fullscreen .editor-area {
    padding-top: 75px;
}

/* =========================================================
   PRINT
========================================================= */

@media print {
    body {
        background: #ffffff;
        overflow: visible;
    }

    .topbar,
    .toolbar,
    .statusbar,
    .find-panel,
    .modal-overlay {
        display: none !important;
    }

    .editor-area {
        padding: 0;
        overflow: visible;
        background: #ffffff;
    }

    #document {
        width: auto;
        gap: 0;
        transform: none !important;
        margin-bottom: 0 !important;
    }

    .page {
        margin: 0;
        box-shadow: none;
        border: 0;

        break-after: page;
        page-break-after: always;
    }

    .page:last-child {
        break-after: auto;
        page-break-after: auto;
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {
    .document-title {
        width: 150px;
    }

    .brand {
        display: none;
    }

    .editor-area {
        padding-left: 10px;
        padding-right: 10px;
    }

    .find-panel {
        left: 10px;
        right: 10px;
        top: 118px;
        width: auto;
    }
}

@media (max-width: 600px) {
    .topbar {
        gap: 5px;
        padding: 0 8px;
    }

    .save-status {
        display: none;
    }

    .top-button {
        padding: 0 8px;
    }

    .editor-area {
        padding-top: 20px;
    }
}
</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

    <div class="brand">
        Patenter
    </div>

    <input
        id="documentTitle"
        class="document-title"
        value="Untitled document"
        aria-label="Document title"
    >

    <span
        id="saveStatus"
        class="save-status"
    >
        Saved
    </span>

    <div class="top-spacer"></div>

    <button
        class="top-button"
        onclick="newDocument()"
    >
        New
    </button>

    <button
        class="top-button"
        onclick="saveNow()"
        title="Save to this browser (Ctrl+S)"
    >
        Save
    </button>

    <button
        class="top-button"
        onclick="openLibrary()"
        title="Open a saved document"
    >
        Documents
    </button>

    <button
        class="top-button"
        onclick="window.print()"
    >
        Print
    </button>

    <button
        class="top-button"
        onclick="toggleFullscreen()"
    >
        Fullscreen
    </button>

</div>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">

    <!-- Undo / redo -->

    <button
        class="tool-button"
        onclick="exec('undo')"
        title="Undo"
    >
        ↶
    </button>

    <button
        class="tool-button"
        onclick="exec('redo')"
        title="Redo"
    >
        ↷
    </button>


    <div class="separator"></div>


    <!-- Style -->

    <select
        id="formatSelect"
        class="tool-select"
        onchange="changeFormat(this.value)"
    >
        <option value="p">Normal text</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
    </select>


    <!-- Font -->

    <select
        class="tool-select font-select"
        onchange="changeFont(this.value)"
    >
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Verdana">Verdana</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Courier New">Courier New</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="Impact">Impact</option>
    </select>


    <!-- Font size -->

    <select
        class="tool-select size-select"
        onchange="changeFontSize(this.value)"
    >
        <option value="12">12</option>
        <option value="14">14</option>
        <option value="16" selected>16</option>
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="28">28</option>
        <option value="32">32</option>
        <option value="40">40</option>
        <option value="48">48</option>
    </select>


    <div class="separator"></div>


    <!-- Text formatting -->

    <button
        class="tool-button"
        onclick="exec('bold')"
        title="Bold"
    >
        <b>B</b>
    </button>

    <button
        class="tool-button"
        onclick="exec('italic')"
        title="Italic"
    >
        <i>I</i>
    </button>

    <button
        class="tool-button"
        onclick="exec('underline')"
        title="Underline"
    >
        <u>U</u>
    </button>

    <button
        class="tool-button"
        onclick="exec('strikeThrough')"
        title="Strikethrough"
    >
        <s>S</s>
    </button>


    <div class="separator"></div>


    <!-- Alignment -->

    <button
        class="tool-button"
        onclick="exec('justifyLeft')"
        title="Align left"
    >
        ☰
    </button>

    <button
        class="tool-button"
        onclick="exec('justifyCenter')"
        title="Center"
    >
        ≡
    </button>

    <button
        class="tool-button"
        onclick="exec('justifyRight')"
        title="Align right"
    >
        ☷
    </button>

    <button

/* =========================================================
   GLOBALS
========================================================= */

const documentContainer =
    document.getElementById("document");

let savedRange = null;

let zoom = 100;

let autosaveTimer = null;


/* =========================================================
   PAGE DIMENSIONS
========================================================= */

const PAGE_CONTENT_HEIGHT_MM = 247;


/* =========================================================
   GET PAGES
========================================================= */

function getPages() {

    return Array.from(
        document.querySelectorAll(".page")
    );
}


/* =========================================================
   GET CONTENT
========================================================= */

function getContentPages() {

    return Array.from(
        document.querySelectorAll(".page-content")
    );
}


/* =========================================================
   EXECUTE COMMAND
========================================================= */

function exec(command, value = null) {

    restoreSelection();

    document.execCommand(
        command,
        false,
        value
    );

    updateEverything();

    saveSelection();
}


/* =========================================================
   FORMAT
========================================================= */

function changeFormat(format) {

        "formatBlock",
        false,

    );

    updateEverything();

    saveSelection();
}


/* =========================================================
   FONT
========================================================= */

function changeFont(font) {

    );

    saveSelection();
}


/* =========================================================
   FONT SIZE
========================================================= */

function changeFontSize(size) {

    restoreSelection();

    document.execCommand(
        "fontSize",
        false,
        "7"
    );

    const fonts =
        document.querySelectorAll(
            'font[size="7"]'
        );

    fonts.forEach(font => {

        font.removeAttribute("size");

        font.style.fontSize =
            size + "px";

    });

    updateEverything();

    saveSelection();
}


/* =========================================================
   SAVE SELECTION
========================================================= */

function saveSelection() {

    const selection =
        window.getSelection();

    if (
        selection &&
        selection.rangeCount > 0
    ) {

        const range =
            selection.getRangeAt(0);

        const parentElement =
            range.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
                ? range.commonAncestorContainer
                : range.commonAncestorContainer.parentElement;

        if (
            parentElement &&
            parentElement.closest(".page-content")
        ) {

            savedRange = range.cloneRange();
        }
    }
}


/* =========================================================
   RESTORE SELECTION
========================================================= */

function restoreSelection() {

    if (!savedRange) {
        return;
    }

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedRange
    );
}


/* =========================================================
   SELECTION EVENTS
========================================================= */

document.addEventListener(
    "selectionchange",
    saveSelection
);


/* =========================================================
   CREATE PAGE
========================================================= */

function createPage() {

    const page =
        document.createElement("div");

    page.className = "page";

    page.innerHTML = `
        <div
            class="page-content"
            contenteditable="true"
            spellcheck="true"
        ></div>

        <div class="page-number"></div>
    `;

    documentContainer.appendChild(page);

    return page;
}


/* =========================================================
   PAGINATION
========================================================= */

function updatePagination() {

    /*
        Pagination strategy:

        1. Combine overflowing content forward.
        2. Split large text blocks if necessary.
        3. Remove unnecessary empty pages.
    */

    let pages = getPages();

    /*
        Check every page.
    */

    for (let i = 0; i < pages.length; i++) {

        const content =
            pages[i].querySelector(
                ".page-content"
            );

        if (!content) continue;

        /*
            Move overflowing block elements.
        */

        while (
            content.scrollHeight >
            content.clientHeight + 2
        ) {

            const children =
                Array.from(
                    content.children
                );

            /*
                No children means the page contains
                direct text. Split it.
            */

            if (children.length === 0) {

                splitTextNode(
                    content,
                    i
                );

                break;
            }

            const last =
                children[
                    children.length - 1
                ];

            let nextPage =
                pages[i + 1];

            if (!nextPage) {
                nextPage =
                    createPage();

                pages =
                    getPages();
            }

            const nextContent =
                nextPage.querySelector(
                    ".page-content"
                );

            /*
                Try to split large elements instead
                of moving the entire element.
            */

            if (
                last.offsetHeight >
                content.clientHeight * 0.75
            ) {

                if (
                    splitElement(
                        last,
                        content,
                        nextContent
                    )
                ) {
                    continue;
                }
            }

            nextContent.prepend(last);
        }
    }

    /*
        Clean empty pages.
    */

    cleanupPages();

    /*
        Update numbers.
    */

    updatePageNumbers();
}


/* =========================================================
   SPLIT LARGE ELEMENT
========================================================= */

function splitElement(
    element,
    currentContent,
    nextContent
) {

    /*
        Only split paragraphs/headings/list items
        containing text.
    */

    const tag =
        element.tagName.toLowerCase();

    if (
        ![
            "p",
            "div",
            "h1",
            "h2",
            "h3",
            "blockquote"
        ].includes(tag)
    ) {
        return false;
    }

    const text =
        element.innerText;

    if (!text.trim()) {
        return false;
    }

    const words =
        text.split(/\s+/);

    if (words.length < 8) {
        return false;
    }

    const originalHTML =
        element.innerHTML;

    let low = 1;
    let high = words.length - 1;

    let best = 0;

    /*
        Binary search for the amount of text
        that fits.
    */

    while (low <= high) {

        const middle =
            Math.floor(
                (low + high) / 2
            );

        const testText =
            words
                .slice(0, middle)
                .join(" ");

        element.innerText =
            testText;

        if (
            currentContent.scrollHeight <=
            currentContent.clientHeight + 2
        ) {

            best = middle;

            low = middle + 1;

        } else {

            high = middle - 1;
        }
    }

    if (best <= 0) {

        element.innerHTML =
            originalHTML;

        return false;
    }

    const firstText =
        words
            .slice(0, best)
            .join(" ");

    const secondText =
        words
            .slice(best)
            .join(" ");

    element.innerText =
        firstText;

    const second =
        element.cloneNode(false);

    second.innerText =
        secondText;

    nextContent.prepend(second);

    return true;
}


/* =========================================================
   SPLIT DIRECT TEXT
========================================================= */

function splitTextNode(
    content,
    pageIndex
) {

    const text =
        content.innerText;

    if (!text.trim()) {
        return;
    }

    const words =
        text.split(/\s+/);

    if (words.length < 2) {
        return;
    }

    let nextPage =
        getPages()[pageIndex + 1];

    if (!nextPage) {
        nextPage =
            createPage();
    }

    const nextContent =
        nextPage.querySelector(
            ".page-content"
        );

    /*
        Find approximate split.
    */

    let low = 1;
    let high = words.length - 1;
    let best = 1;

    while (low <= high) {

        const middle =
            Math.floor(
                (low + high) / 2
            );

        content.innerText =
            words
                .slice(0, middle)
                .join(" ");

        if (
            content.scrollHeight <=
            content.clientHeight + 2
        ) {

            best = middle;
            low = middle + 1;

        } else {

            high = middle - 1;
        }
    }

    content.innerText =
        words
            .slice(0, best)
            .join(" ");

    nextContent.innerText =
        words
            .slice(best)
            .join(" ");
}


/* =========================================================
   CLEANUP
========================================================= */

function cleanupPages() {

    const pages =
        getPages();

    /*
        Remove empty pages except the first.
    */

    for (
        let i = pages.length - 1;
        i > 0;
        i--
    ) {

        const content =
            pages[i]
                .querySelector(
                    ".page-content"
                );

        if (
            !content.innerHTML.trim()
        ) {

            pages[i].remove();
        }
    }

    /*
        If no pages exist, create one.
    */

    if (
        getPages().length === 0
    ) {

        createPage();
    }
}


/* =========================================================
   PAGE NUMBERS
========================================================= */

function updatePageNumbers() {

    const pages =
        getPages();

    pages.forEach(
        (page, index) => {

            const number =
                page.querySelector(
                    ".page-number"
                );

            number.textContent =
                `Page ${index + 1} of ${pages.length}`;
        }
    );

    document.getElementById(
        "pageCount"
    ).textContent =
        `${pages.length} ${
            pages.length === 1
                ? "page"
                : "pages"
        }`;
}


/* =========================================================
   WORD COUNT
========================================================= */

function updateCounts() {

    let text = "";

    getContentPages().forEach(
        content => {

            text +=
                content.innerText +
                " ";
        }
    );

    const clean =
        text.trim();

    const words =
        clean
            ? clean.split(/\s+/).length
            : 0;

    const characters =
        text.length;

    document.getElementById(
        "wordCount"
    ).textContent =
        `${words} ${
            words === 1
                ? "word"
                : "words"
        }`;

    document.getElementById(
        "characterCount"
    ).textContent =
        `${characters} characters`;
}


/* =========================================================
   UPDATE EVERYTHING
========================================================= */

function updateEverything() {

    updatePagination();

    updateCounts();

    updatePageNumbers();

    scheduleAutosave();
}


/* =========================================================
   INPUT
========================================================= */

document.addEventListener(
    "input",
    event => {

        if (
            event.target.classList.contains(

);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        const modifier =
            event.ctrlKey ||
            event.metaKey;

        if (!modifier) {
            return;
        }

        const key =
            event.key.toLowerCase();

        /*
            Bold
        */

        if (key === "b") {

            event.preventDefault();

            exec("bold");
        }

        /*
            Italic
        */

        if (key === "i") {

            event.preventDefault();

            exec("italic");
        }

        /*
            Underline
        */

        if (key === "u") {

            event.preventDefault();

            exec("underline");
        }

        /*
            Save
        */

        if (key === "s") {

            event.preventDefault();

            saveNow();
        }

        /*
            Find
        */

        if (key === "f") {

            event.preventDefault();

            toggleFind();
        }

        /*
            Print
        */

        if (key === "p") {

            event.preventDefault();

            window.print();
        }
    }
);

/* =========================================================

========================================================= */

function insertImage() {

        document.createElement("input");

    input.type = "file";

    input.onchange =
        function() {

            const file =

            if (!file) {

            const reader =
                new FileReader();

            reader.onload =
                function(event) {

                    restoreSelection();

                    document.execCommand(

                    );

                    /*

                        }

                    updateEverything();
                };

        };

/* =========================================================
   FIND PANEL
========================================================= */

function toggleFind() {

    const panel =
        document.getElementById(
            "findPanel"
        );

    panel.classList.toggle("open");

        panel.classList.contains("open")
    ) {

        document.getElementById(
            "findInput"
        ).focus();
    }
}

function closeFind() {

    document.getElementById(
        "findPanel"
    ).classList.remove("open");
}


/* =========================================================
   FIND TEXT
========================================================= */

function findText() {

    const query =
        document.getElementById(
            "findInput"
        ).value;

    if (!query) {

        document.getElementById(
            "findInfo"
        ).textContent =
            "Search the document";

        return;
    }

    const text =
        getContentPages()
            .map(
                page => page.innerText
            )
            .join("\n");

    const regex =
        new RegExp(
            escapeRegExp(query),
            "gi"
        );

    const matches =
        text.match(regex);

    const count =
        matches
            ? matches.length
            : 0;

    document.getElementById(
        "findInfo"
    ).textContent =
        `${count} ${
            count === 1
                ? "match"
                : "matches"
        } found`;

    findNext();
}


/* =========================================================
   FIND NEXT
========================================================= */

function findNext() {

    const query =
        document.getElementById(
            "findInput"
        ).value;

    if (!query) {
        return;
    }

    const selection =
        window.getSelection();

    const range =
        document.createRange();

    /*
        Browser native find is useful here because
        it can search across editable pages.
    */

    if (
        window.find
    ) {

        window.find(
            query,
            false,
            false,
            true,
            false,
            false,
            false
        );
    }
}

function findPrevious() {

    const query =
        document.getElementById(
            "findInput"
        ).value;

    if (!query) {
        return;
    }

    if (
        window.find
    ) {

        window.find(
            query,
            false,
            true,
            true,
            false,
            false,
            false
        );
    }
}


/* =========================================================
   REPLACE CURRENT
========================================================= */

function replaceCurrent() {

    const find =
        document.getElementById(
            "findInput"
        ).value;

    const replace =
        document.getElementById(
            "replaceInput"
        ).value;

    if (!find) {
        return;
    }

    const selection =
        window.getSelection();

    if (
        selection &&
        selection.rangeCount > 0
    ) {

        const selected =
            selection.toString();

        if (
            selected.toLowerCase() ===
            find.toLowerCase()
        ) {

            document.execCommand(
                "insertText",
                false,
                replace
            );

            updateEverything();

            findNext();
        }
    }
}


/* =========================================================
   REPLACE ALL
========================================================= */

function replaceAll() {

    const find =
        document.getElementById(
            "findInput"
        ).value;

    const replace =
        document.getElementById(
            "replaceInput"
        ).value;

    if (!find) {
        return;
    }

    getContentPages().forEach(
        content => {

            const walker =
                document.createTreeWalker(
                    content,
                    NodeFilter.SHOW_TEXT
                );

            const nodes = [];

            while (
                walker.nextNode()
            ) {

                nodes.push(
                    walker.currentNode
                );
            }

            nodes.forEach(
                node => {

                    node.nodeValue =
                        node.nodeValue.replace(
                            new RegExp(
                                escapeRegExp(find),
                                "gi"
                            ),
                            replace
                        );
                }
            );
        }
    );

    updateEverything();

    findText();
}


/* =========================================================
   ESCAPE REGEX
========================================================= */

function escapeRegExp(text) {

    return text.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    );
}

/* =========================================================
   EDITOR-SIDE STORAGE (on top of the shared layer)
========================================================= */

const DOCS_STORE = "documents";
const META_STORE = "meta";
const DEFAULT_TITLE = "Untitled document";

let currentDocumentId = null;
let currentCreatedAt = null;
let currentPersisted = false;
let autosaveRunning = null;

const openDB = () => patenterOpenDB();

// Small helper: run one request in a transaction and resolve when it commits.
async function dbRequest(storeName, mode, makeRequest) {

    const db = await openDB();

    return new Promise((resolve, reject) => {

        const transaction = db.transaction(storeName, mode);
        const request = makeRequest(transaction.objectStore(storeName));

        let result;

        request.onsuccess = () => { result = request.result; };

        transaction.oncomplete = () => resolve(result);
        transaction.onerror = () => reject(transaction.error || request.error);
        transaction.onabort = () => reject(transaction.error || new Error("Transaction aborted"));
    });
}

const dbGetDocument = id =>
    dbRequest(DOCS_STORE, "readonly", store => store.get(id));

// Merge into the stored row so type/status/ref set in the library are kept.
const dbPutDocument = ({ id, title, pages, createdAt, updatedAt }) =>
    patenterPatch([{
        id,
        changes: { title, pages, updatedAt, kind: "editor" },
        create: { id, createdAt, kind: "editor" }
    }]);

const dbDeleteDocument = async id => {
    await dbRequest(DOCS_STORE, "readwrite", store => store.delete(id));
    patenterNotify([id]);
};

async function dbListDocuments() {

    const docs = await dbRequest(DOCS_STORE, "readonly", store => store.getAll());

    // Uploaded files live in the same store; the editor only lists its own documents.
    return (docs || [])
        .filter(patenterIsEditorDoc)
        .sort((a, b) => patenterToMs(b.updatedAt || b.savedAt) - patenterToMs(a.updatedAt || a.savedAt));
}

const dbSetMeta = (key, value) =>
    dbRequest(META_STORE, "readwrite", store => store.put({ key, value }));

async function dbGetMeta(key) {

    const row = await dbRequest(META_STORE, "readonly", store => store.get(key));

    return row ? row.value : undefined;
}

function generateId() {

    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return "doc-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

function setSaveStatus(text) {

    document.getElementById("saveStatus").textContent = text;
}


/* =========================================================
   AUTOSAVE
========================================================= */

function scheduleAutosave() {

    clearTimeout(autosaveTimer);

    setSaveStatus("Saving...");

    autosaveTimer = setTimeout(autosave, 700);
}

function isBlankDocument(data) {

    const noText = data.pages.every(html => {
        const div = document.createElement("div");
        div.innerHTML = html;
        return !div.textContent.trim() && !div.querySelector("img, hr");
    });

    return noText && (!data.title.trim() || data.title.trim() === DEFAULT_TITLE);
}

async function autosave() {

    autosaveTimer = null;

    // Serialise saves so two writes can never interleave.
    if (autosaveRunning) {
        await autosaveRunning;
    }

    autosaveRunning = (async () => {

        try {

            const data = collectDocument();

            // Don't fill the library with empty "Untitled" documents.
            if (!currentPersisted && isBlankDocument(data)) {
                setSaveStatus("");
                return;
            }

            if (!currentDocumentId) {
                currentDocumentId = generateId();
            }

            const now = Date.now();

            if (!currentCreatedAt) {
                currentCreatedAt = now;
            }

            await dbPutDocument({
                id: currentDocumentId,
                title: data.title,
                pages: data.pages,
                createdAt: currentCreatedAt,
                updatedAt: now
            });

            currentPersisted = true;

            await dbSetMeta("lastOpenedId", currentDocumentId);

            setSaveStatus("Saved");

        } catch (error) {

            console.error("Could not save document:", error);

            setSaveStatus("Save failed");
        }
    })();

    await autosaveRunning;

    autosaveRunning = null;
}

// Save immediately if a save is waiting (used before switching documents).
async function flushAutosave() {

    if (autosaveTimer) {
        clearTimeout(autosaveTimer);
        await autosave();
    } else if (autosaveRunning) {
        await autosaveRunning;
    }
}

// Save button / Ctrl+S
async function saveNow() {

    clearTimeout(autosaveTimer);
    autosaveTimer = null;

    const wasPersisted = currentPersisted;

    // An explicit save keeps even a blank document.
    currentPersisted = true;

    await autosave();

    if (!wasPersisted && document.getElementById("saveStatus").textContent !== "Saved") {
        currentPersisted = false;
    }
}

// Try to save pending edits when the tab is hidden or closed.
document.addEventListener("visibilitychange", () => {

    if (document.visibilityState === "hidden") {
        flushAutosave();
    }
});

window.addEventListener("beforeunload", event => {

    if (autosaveTimer || autosaveRunning) {
        flushAutosave();
        event.preventDefault();
        event.returnValue = "";
    }
});


/* =========================================================
   LOADING / SWITCHING DOCUMENTS
========================================================= */

// Document HTML can come from imported files or AI output, so strip
// scripts, event handlers and javascript: links before it touches the page.
function sanitizeDocumentHTML(html) {

    if (window.DOMPurify) {
        return DOMPurify.sanitize(html);
    }

    // Fallback if the CDN is unreachable: DOMParser documents are inert,
    // so nothing runs while we clean it.
    const doc = new DOMParser().parseFromString(html, "text/html");

    doc.querySelectorAll("script, iframe, object, embed, link, meta, base, form").forEach(el => el.remove());

    doc.body.querySelectorAll("*").forEach(el => {
        [...el.attributes].forEach(attr => {
            const name = attr.name.toLowerCase();
            const value = attr.value.trim().toLowerCase();
            if (name.startsWith("on") || (/^(href|src|xlink:href|action|formaction)$/.test(name) && value.startsWith("javascript:"))) {
                el.removeAttribute(attr.name);
            }
        });
    });

    return doc.body.innerHTML;
}

// Put a stored document into the editor without triggering a save.
function renderDocument(record) {

    document.getElementById("documentTitle").value = record.title || DEFAULT_TITLE;

    documentContainer.innerHTML = "";

    const pages = record.pages && record.pages.length ? record.pages : [""];

    pages.forEach(html => {
        createPage().querySelector(".page-content").innerHTML = sanitizeDocumentHTML(html);
    });

    updatePagination();
    updateCounts();
    updatePageNumbers();

    const area = document.getElementById("editorArea");

    if (area) {
        area.scrollTop = 0;
    }
}

async function openDocument(id) {

    await flushAutosave();

    try {

        const record = await dbGetDocument(id);

        if (!record || !patenterIsEditorDoc(record)) {
            alert("That document could not be found.");
            return;
        }

        currentDocumentId = record.id;
        currentCreatedAt = patenterToMs(record.createdAt || record.savedAt) || Date.now();
        currentPersisted = true;

        renderDocument(record);

        await dbSetMeta("lastOpenedId", record.id);

        setSaveStatus("Saved");

        focusFirstPage();

    } catch (error) {

        console.error("Could not open document:", error);
        alert("Could not open the document.");
    }
}

async function startNewDocument() {

    await flushAutosave();

    currentDocumentId = generateId();
    currentCreatedAt = null;
    currentPersisted = false;

    renderDocument({ title: DEFAULT_TITLE, pages: [""] });

    setSaveStatus("");

    focusFirstPage();
}


/* =========================================================
   DOCUMENTS LIBRARY UI
========================================================= */

let libraryDocs = [];

function formatWhen(iso) {

    if (!iso) {
        return "";
    }

    const date = new Date(iso);
    const seconds = (Date.now() - date.getTime()) / 1000;

    if (seconds < 60) return "just now";
    if (seconds < 3600) return Math.floor(seconds / 60) + " min ago";
    if (seconds < 86400) return Math.floor(seconds / 3600) + " h ago";
    if (seconds < 7 * 86400) return Math.floor(seconds / 86400) + " d ago";

    return date.toLocaleDateString();
}

function documentPlainText(record) {

    const div = document.createElement("div");

    div.innerHTML = (record.pages || []).join(" ");

    return div.textContent.replace(/\s+/g, " ").trim();
}

async function openLibrary() {

    await flushAutosave();

    document.getElementById("libraryModal").classList.add("open");

    const search = document.getElementById("librarySearch");

    search.value = "";

    try {

        libraryDocs = (await dbListDocuments()).map(doc => ({
            ...doc,
            text: documentPlainText(doc)
        }));

    } catch (error) {

        console.error("Could not list documents:", error);
        libraryDocs = [];
    }

    renderLibrary();

    search.focus();
}

function closeLibrary() {

    document.getElementById("libraryModal").classList.remove("open");
}

function renderLibrary() {

    const list = document.getElementById("libraryList");
    const query = document.getElementById("librarySearch").value.trim().toLowerCase();

    const docs = libraryDocs.filter(doc =>
        !query ||
        (doc.title || "").toLowerCase().includes(query) ||
        doc.text.toLowerCase().includes(query)
    );

    if (!libraryDocs.length) {
        list.innerHTML = '<div class="library-empty">No saved documents yet. Start typing and your work is saved here automatically.</div>';
        return;
    }

    if (!docs.length) {
        list.innerHTML = '<div class="library-empty">No documents match your search.</div>';
        return;
    }

    list.innerHTML = docs.map(doc => {

        const words = doc.text ? doc.text.split(" ").length : 0;
        const pages = (doc.pages || []).length || 1;
        const snippet = doc.text.slice(0, 120);

        return `
            <div
                class="library-item${doc.id === currentDocumentId ? " current" : ""}"
                data-id="${escapeHTML(doc.id)}"
                tabindex="0"
                role="button"
            >
                <div class="library-item-main">
                    <div class="library-item-title">${escapeHTML(doc.title || DEFAULT_TITLE)}</div>
                    <div class="library-item-meta">
                        Edited ${escapeHTML(formatWhen(doc.updatedAt || doc.savedAt))}
                        · ${words} ${words === 1 ? "word" : "words"}
                        · ${pages} ${pages === 1 ? "page" : "pages"}
                        ${doc.id === currentDocumentId ? " · open now" : ""}
                    </div>
                    ${snippet ? `<div class="library-item-snippet">${escapeHTML(snippet)}</div>` : ""}
                </div>
                <button
                    class="library-delete"
                    data-delete="${escapeHTML(doc.id)}"
                    title="Delete document"
                >
                    Delete
                </button>
            </div>
        `;
    }).join("");
}

async function deleteDocument(id) {

    const doc = libraryDocs.find(d => d.id === id);
    const name = doc ? (doc.title || DEFAULT_TITLE) : "this document";

    if (!confirm(`Delete "${name}"? This cannot be undone.`)) {
        return;
    }

    try {

        if (id === currentDocumentId) {
            // Stop any pending save from recreating it.
            clearTimeout(autosaveTimer);
            autosaveTimer = null;
            if (autosaveRunning) await autosaveRunning;
        }

        await dbDeleteDocument(id);

        libraryDocs = libraryDocs.filter(d => d.id !== id);

        if (id === currentDocumentId) {

            currentPersisted = false;

            if (libraryDocs.length) {
                await openDocument(libraryDocs[0].id);
            } else {
                await startNewDocument();
            }
        }

        renderLibrary();

    } catch (error) {

        console.error("Could not delete document:", error);
        alert("Could not delete the document.");
    }
}

document.getElementById("libraryList").addEventListener("click", event => {

    const deleteButton = event.target.closest("[data-delete]");

    if (deleteButton) {
        event.stopPropagation();
        deleteDocument(deleteButton.dataset.delete);
        return;
    }

    const item = event.target.closest(".library-item");

    if (item) {
        closeLibrary();
        openDocument(item.dataset.id);
    }
});

document.getElementById("libraryList").addEventListener("keydown", event => {

    const item = event.target.closest(".library-item");

    if (item && event.target === item && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        closeLibrary();
        openDocument(item.dataset.id);
    }
});

document.getElementById("librarySearch").addEventListener("input", renderLibrary);

document.getElementById("libraryModal").addEventListener("mousedown", event => {

    if (event.target.id === "libraryModal") {
        closeLibrary();
    }
});

document.addEventListener("keydown", event => {

    if (
        event.key === "Escape" &&
        document.getElementById("libraryModal").classList.contains("open")
    ) {
        closeLibrary();
    }
});


/* =========================================================
   COLLECT DOCUMENT
========================================================= */

function collectDocument() {

    return {

        title:
            document.getElementById(
                "documentTitle"
            ).value,

        pages:
            getContentPages().map(
                page => page.innerHTML
            ),

        savedAt:
            new Date().toISOString()
    };
}


/* =========================================================
   RESTORE AUTOSAVE
========================================================= */

// "Open In Editor" on the AI page leaves its answer here.
async function importFromAI() {

    let html = null;

    try {
        html = localStorage.getItem("patenter_document");
        localStorage.removeItem("patenter_document");
    } catch {}

    if (!html) {
        return false;
    }

    const probe = document.createElement("div");
    probe.innerHTML = sanitizeDocumentHTML(html);
    const heading = probe.querySelector("h1, h2");
    const title = heading
        ? heading.textContent.trim().slice(0, 200)
        : DEFAULT_TITLE;

    currentDocumentId = generateId();
    currentCreatedAt = null;
    currentPersisted = false;

    renderDocument({ title, pages: [probe.innerHTML] });

    scheduleAutosave();

    return true;
}

async function restoreAutosave() {

    try {

        if (await importFromAI()) {
            return;
        }

        // ?id=... (from the library) wins over the last opened document.
        const requestedId = new URLSearchParams(location.search).get("id");
        const lastId = requestedId || await dbGetMeta("lastOpenedId");

        let record = lastId ? await dbGetDocument(lastId) : null;

        if (record && !patenterIsEditorDoc(record)) {
            record = null;
        }

        if (record && requestedId) {
            await dbSetMeta("lastOpenedId", record.id);
        }

        if (!record) {
            const docs = await dbListDocuments();
            record = docs[0] || null;
        }

        if (record) {

            currentDocumentId = record.id;
            currentCreatedAt = patenterToMs(record.createdAt || record.savedAt) || Date.now();
            currentPersisted = true;

            renderDocument(record);

            setSaveStatus("Saved");

            return;
        }

    } catch (error) {

        console.error("Could not restore documents:", error);

        setSaveStatus("Storage unavailable");
    }

    currentDocumentId = generateId();
    currentPersisted = false;

    setSaveStatus("");
}


/* =========================================================
   SAVE FILE
========================================================= */

function saveFile() {

    const data =
        collectDocument();

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            "a"
        );

    link.href = url;

    const title =
        data.title
            .replace(
                /[^a-z0-9]/gi,
                "_"
            );

    link.download =
        `${title || "document"}.json`;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   LOAD FILE
========================================================= */

function loadFile() {

    const input =
        document.createElement(
            "input"
        );

    input.type = "file";

    input.accept =
        ".json,application/json";

    input.onchange =
        function() {

            const file =
                input.files[0];

            if (!file) {
                return;
            }

            const reader =
                new FileReader();

            reader.onload =
                function() {

                    try {

                        const data =
                            JSON.parse(
                                reader.result
                            );

                        if (
                            !data.pages
                        ) {
                            throw new Error(
                                "Invalid document"
                            );
                        }

                        // Imported files become a new document in the library.
                        (async () => {

                            await flushAutosave();

                            currentDocumentId = generateId();
                            currentCreatedAt = null;
                            currentPersisted = true;

                            renderDocument(data);

                            await saveNow();

                            closeLibrary();
                        })();

                    } catch (error) {

                        alert(
                            "Could not load the document."
                        );
                    }
                };

            reader.readAsText(file);
        };

    input.click();
}
